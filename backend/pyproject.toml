[project]
name = "pnb-productivity-backend"
version = "0.1.0"
description = "PNB Employee Productivity Tool - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not ollama'"
markers = [
    "ollama: needs live local Ollama (and LanguageTool for proofread); run with `uv run pytest -m ollama`",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
